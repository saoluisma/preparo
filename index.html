<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Portal | Sala Personalizada</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 1;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 2;
        }
        .timer-container {
            background: linear-gradient(135deg, #1a0a0a, #0d0d0d);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid #330000;
            box-shadow: 0 0 20px rgba(255,0,0,0.1);
        }
        .timer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff4444;
            margin-bottom: 0.5rem;
        }
        .timer {
            font-family: 'Creepster', monospace;
            font-size: 3.5rem;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
            letter-spacing: 4px;
        }
        .timer-warning {
            font-size: 0.7rem;
            color: #ff8888;
            margin-top: 0.5rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .card {
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(5px);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #2a1a1a;
            margin-bottom: 1.5rem;
        }
        .card-header {
            padding: 1.25rem;
            border-bottom: 1px solid #2a1a1a;
            background: rgba(0,0,0,0.5);
        }
        .card-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6666;
        }
        .card-header h2 {
            font-size: 1.125rem;
            color: #ff8888;
        }
        .card-body {
            padding: 1.25rem;
        }
        .mensagem-item {
            background: rgba(30,15,15,0.8);
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            border-left: 3px solid #ff3333;
        }
        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .foto {
            width: 100%;
            border-radius: 0.75rem;
            border: 1px solid #3a2a2a;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .foto:hover {
            transform: scale(1.02);
            border-color: #ff3333;
        }
        .chat-messages {
            background: rgba(0,0,0,0.5);
            border-radius: 0.75rem;
            height: 300px;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .message {
            margin-bottom: 1rem;
            max-width: 80%;
            padding: 0.5rem 0.875rem;
            border-radius: 1rem;
            font-size: 0.8125rem;
        }
        .message-admin {
            background: #2a1a1a;
            color: #ff8888;
            margin-left: auto;
            border: 1px solid #ff3333;
        }
        .message-user {
            background: #1a1a1a;
            color: #cccccc;
            margin-right: auto;
            border: 1px solid #333;
        }
        .message-img {
            max-width: 200px;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .message-file {
            background: rgba(255,255,255,0.1);
            padding: 0.5rem;
            border-radius: 0.5rem;
            display: inline-block;
            margin-top: 0.5rem;
            color: white;
            text-decoration: none;
        }
        .message small {
            font-size: 0.5625rem;
            opacity: 0.6;
            display: block;
            margin-top: 0.25rem;
        }
        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a2a2a;
            border-radius: 0.75rem;
            color: #e0e0e0;
            font-size: 0.875rem;
        }
        .file-btn {
            background: #2a2a2a;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            border: 1px solid #3a3a3a;
            color: white;
            font-size: 0.875rem;
        }
        .btn-send {
            background: #ff3333;
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-send:hover {
            background: #cc0000;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        .btn-pagar {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            border: none;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 800;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            animation: pulseRed 2s infinite;
        }
        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 10px rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 30px rgba(255,0,0,0.8); }
        }
        .btn-pagar:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #ff3333, #ff0000);
            box-shadow: 0 0 30px rgba(255,0,0,0.8);
        }
        .btn-pagar:active {
            transform: scale(0.98);
        }
        .sala-fechada {
            text-align: center;
            padding: 2rem;
        }
        .sala-fechada h1 {
            color: #ff9500;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .sala-fechada p {
            font-size: 1.125rem;
            line-height: 1.5;
            color: #ffaa44;
        }
        .empty-state, .loading {
            text-align: center;
            padding: 3rem;
            color: #886666;
        }
        .time-update-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3333;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            animation: fadeInOut 3s ease;
            z-index: 100;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        .close-img {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }
        .close-img:hover {
            color: #ff3333;
        }

        /* Popup de boas-vindas */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeInPopup 0.3s ease;
            cursor: pointer;
        }
        @keyframes fadeInPopup {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .popup-container {
            max-width: 90%;
            max-height: 90%;
            position: relative;
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .popup-container img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            border: 2px solid #ff3333;
        }
        .popup-close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff3333;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .popup-close-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }
        .popup-timer-bar {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 51, 51, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }
        .popup-timer-bar .timer-fill {
            height: 100%;
            width: 100%;
            background: #ff3333;
            animation: timerProgress linear forwards;
        }
        @keyframes timerProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>
<body>
<div id="loading" class="loading">Carregando portal...</div>
<div id="content" style="display: none;"></div>
<div id="imageModal" class="image-modal" onclick="fecharImagem()">
    <button class="close-img" onclick="fecharImagem()">✕</button>
    <img id="modalImage" src="">
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const casaId = urlParams.get('id');
    let visitanteId = localStorage.getItem('visitanteId');
    let currentExpiraEm = null;
    let timerInterval = null;
    let chatUnsubscribe = null;
    let cliqueRegistrado = false;
    let popupUnsubscribe = null;

    if (!visitanteId) {
        visitanteId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('visitanteId', visitanteId);
    }

    if (!casaId) {
        document.getElementById('loading').innerHTML = '<div class="empty-state">❌ QR Code inválido</div>';
    } else {
        registrarVisita();
        carregarCasa(casaId);
        monitorarTempoDaSala(casaId);
    }

    async function registrarVisita() {
        const snapshot = await db.ref(`casas/${casaId}`).once('value');
        const casa = snapshot.val();
        if (casa && casa.nome) {
            await db.ref(`visitantes/${visitanteId}`).set({
                salaId: casaId,
                salaNome: casa.nome,
                idVisitante: visitanteId,
                entrada: Date.now(),
                ultimaAtividade: Date.now()
            });
            setInterval(() => {
                db.ref(`visitantes/${visitanteId}/ultimaAtividade`).set(Date.now());
            }, 30000);
        }
    }

    function abrirImagem(src) {
        document.getElementById('modalImage').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function fecharImagem() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function monitorarTempoDaSala(id) {
        db.ref(`casas/${id}`).on('value', (snapshot) => {
            const casa = snapshot.val();
            if (casa && casa.expiraEm && currentExpiraEm !== casa.expiraEm) {
                currentExpiraEm = casa.expiraEm;
                if (timerInterval) clearInterval(timerInterval);
                iniciarTimer(currentExpiraEm);
                mostrarToast('⏱️ O administrador alterou o tempo da sala!');
            }
        });
    }

    function mostrarToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'time-update-toast';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // FUNÇÃO DO POPUP COM CONTROLE DE VERSÃO
    function mostrarPopup(imagemUrl, duracaoMs, versaoAtual) {
        const storageKey = `popup_visto_${casaId}`;
        const versaoVista = localStorage.getItem(storageKey);
        
        // Só mostra se a versão for diferente (nova)
        if (versaoVista && parseInt(versaoVista) === versaoAtual) {
            console.log('Popup já foi visto nesta versão:', versaoAtual);
            return;
        }
        
        console.log('Mostrando popup pela primeira vez - Versão:', versaoAtual);
        
        const overlay = document.createElement('div');
        overlay.className = 'popup-overlay';
        
        const container = document.createElement('div');
        container.className = 'popup-container';
        
        const img = document.createElement('img');
        img.src = imagemUrl;
        img.alt = 'Popup de boas-vindas';
        
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕';
        closeBtn.className = 'popup-close-btn';
        
        const timerBar = document.createElement('div');
        timerBar.className = 'popup-timer-bar';
        const timerFill = document.createElement('div');
        timerFill.className = 'timer-fill';
        timerFill.style.animationDuration = `${duracaoMs}ms`;
        timerBar.appendChild(timerFill);
        
        container.appendChild(img);
        container.appendChild(closeBtn);
        container.appendChild(timerBar);
        overlay.appendChild(container);
        
        document.body.appendChild(overlay);
        
        const fecharPopup = () => {
            if (document.body.contains(overlay)) {
                overlay.remove();
            }
        };
        
        closeBtn.onclick = (e) => {
            e.stopPropagation();
            fecharPopup();
        };
        
        overlay.onclick = (e) => {
            if (e.target === overlay) {
                fecharPopup();
            }
        };
        
        const timeoutId = setTimeout(fecharPopup, duracaoMs);
        
        // Salvar que esta versão já foi vista
        localStorage.setItem(storageKey, versaoAtual.toString());
    }

    function monitorarPopup(id) {
        if (popupUnsubscribe) {
            popupUnsubscribe();
        }
        const popupRef = db.ref(`casas/${id}/popup`);
        const listener = popupRef.on('value', (snapshot) => {
            const popupConfig = snapshot.val();
            if (popupConfig && popupConfig.ativo && popupConfig.imagem) {
                const versao = popupConfig.versao || 1;
                mostrarPopup(popupConfig.imagem, popupConfig.duracao || 5000, versao);
            }
        });
        popupUnsubscribe = () => popupRef.off('value', listener);
    }

    window.realizarPagamento = async function() {
        window.open('https://www.youtube.com/', '_blank');
        if (!cliqueRegistrado) {
            cliqueRegistrado = true;
            await db.ref(`cliques_pagamento/${casaId}`).push({
                visitanteId: visitanteId,
                data: Date.now(),
                dataFormatada: new Date().toLocaleString()
            });
            const toast = document.createElement('div');
            toast.className = 'time-update-toast';
            toast.innerHTML = `🔗 Redirecionando... O administrador foi notificado!`;
            toast.style.background = '#ff9500';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
    };

    async function carregarCasa(id) {
        const snapshot = await db.ref(`casas/${id}`).once('value');
        const casa = snapshot.val();
        if (!casa) {
            document.getElementById('loading').innerHTML = '<div class="empty-state">❌ Sala não encontrada</div>';
            return;
        }
        if (casa.status === 'fechada') {
            const msg = casa.mensagemEncerramento || "🎉 PARABÉNS! Pagamento confirmado! Sala encerrada. Obrigado! 🎉";
            document.getElementById('loading').innerHTML = `<div class="sala-fechada"><h1>💰 Pagamento Confirmado!</h1><p>${msg}</p></div>`;
            return;
        }
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('content');
        container.style.display = 'block';
        let html = `
            <div class="container">
                <div class="timer-container">
                    <div class="timer-label">✦ TEMPO RESTANTE ✦</div>
                    <div class="timer" id="timerDisplay">--:--:--</div>
                    <div class="timer-warning" id="timerWarning">Este portal será encerrado em breve</div>
                </div>
                <button class="btn-pagar" onclick="realizarPagamento()">🎬 CLIQUE AQUI PARA PAGAR 🎬</button>
                <div class="card">
                    <div class="card-header">
                        <h1>🏚️ ${escapeHtml(casa.nome)}</h1>
                    </div>
                    <div class="card-body">
                        <div class="mensagens">
        `;
        if (casa.mensagens && casa.mensagens.length > 0) {
            casa.mensagens.forEach(msg => {
                html += `<div class="mensagem-item">📜 ${escapeHtml(msg)}</div>`;
            });
        } else {
            html += `<div class="mensagem-item">⚠️ Nenhuma mensagem registrada</div>`;
        }
        html += `</div>`;
        if (casa.fotos && casa.fotos.length > 0) {
            html += `<div class="fotos-grid">`;
            casa.fotos.forEach(foto => {
                html += `<img src="${foto}" class="foto" onclick="abrirImagem('${foto}')">`;
            });
            html += `</div>`;
        }
        html += `
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2>💬 Chat com Atendente</h2>
                    </div>
                    <div class="card-body">
                        <div id="chatMessages" class="chat-messages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
                            <button class="file-btn" onclick="document.getElementById('fileInputCliente').click()">📎</button>
                            <button class="file-btn" onclick="document.getElementById('imageInputCliente').click()">🖼️</button>
                            <input type="file" id="fileInputCliente" style="display:none" onchange="enviarArquivoCliente(this, 'arquivo')">
                            <input type="file" id="imageInputCliente" style="display:none" accept="image/*" onchange="enviarArquivoCliente(this, 'imagem')">
                            <button class="btn-send" onclick="enviarMensagemUsuario()">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML = html;
        currentExpiraEm = casa.expiraEm || (Date.now() + (48 * 3600000));
        iniciarTimer(currentExpiraEm);
        iniciarChat(id);
        monitorarPopup(id);
    }

    function iniciarTimer(expiraEm) {
        const timerDisplay = document.getElementById('timerDisplay');
        const timerWarning = document.getElementById('timerWarning');
        if (!timerDisplay) return;
        function atualizarTimer() {
            const diff = expiraEm - Date.now();
            if (diff <= 0) {
                timerDisplay.innerHTML = '00:00:00';
                timerWarning.innerHTML = '⌛ PORTAL ENCERRADO ⌛';
                if (timerInterval) clearInterval(timerInterval);
                return;
            }
            const horas = Math.floor(diff / 3600000);
            const minutos = Math.floor((diff % 3600000) / 60000);
            const segundos = Math.floor((diff % 60000) / 1000);
            timerDisplay.innerHTML = `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            if (diff < 3600000) {
                timerWarning.innerHTML = '⚠️ MENOS DE 1 HORA! ⚠️';
                timerDisplay.style.color = '#ff0000';
            } else if (diff < 7200000) {
                timerWarning.innerHTML = '⌛ Menos de 2 horas...';
            } else {
                timerWarning.innerHTML = 'Portal será encerrado automaticamente';
            }
        }
        atualizarTimer();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(atualizarTimer, 1000);
    }

    window.enviarArquivoCliente = async function(input, tipo) {
        if (!casaId) return;
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const isImage = tipo === 'imagem' || file.type.startsWith('image/');
            await db.ref(`chats/${casaId}/mensagens`).push({
                de: 'user',
                texto: isImage ? '📷 Imagem' : `📎 ${file.name}`,
                arquivo: e.target.result,
                nome: file.name,
                tipo: isImage ? 'imagem' : 'arquivo',
                timestamp: Date.now(),
                lida: false
            });
            db.ref(`visitantes/${visitanteId}/ultimaAtividade`).set(Date.now());
        };
        reader.readAsDataURL(file);
        input.value = '';
    };

    function iniciarChat(id) {
        if (chatUnsubscribe) chatUnsubscribe();
        const messagesDiv = document.getElementById('chatMessages');
        const chatRef = db.ref(`chats/${id}/mensagens`).orderByChild('timestamp');
        const listener = chatRef.on('value', (snapshot) => {
            const msgs = snapshot.val();
            messagesDiv.innerHTML = '';
            if (msgs) {
                Object.values(msgs).forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.de === 'admin' ? 'message-admin' : 'message-user'}`;
                    let content = `<strong>${msg.de === 'admin' ? '🕯️ Atendente' : '👤 Você'}</strong>`;
                    if (msg.texto) content += `<div>${escapeHtml(msg.texto)}</div>`;
                    if (msg.tipo === 'imagem' && msg.arquivo) content += `<img src="${msg.arquivo}" class="message-img" onclick="abrirImagem('${msg.arquivo}')">`;
                    else if (msg.tipo === 'arquivo' && msg.arquivo && msg.nome) content += `<div><a href="${msg.arquivo}" download="${msg.nome}" class="message-file">📎 ${msg.nome}</a></div>`;
                    content += `<small>${new Date(msg.timestamp).toLocaleTimeString()}</small>`;
                    msgDiv.innerHTML = content;
                    messagesDiv.appendChild(msgDiv);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        });
        chatUnsubscribe = () => chatRef.off('value', listener);
        window.enviarMensagemUsuario = async function() {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto) return;
            await db.ref(`chats/${id}/mensagens`).push({
                de: 'user',
                texto: texto,
                timestamp: Date.now(),
                lida: false
            });
            input.value = '';
            db.ref(`visitantes/${visitanteId}/ultimaAtividade`).set(Date.now());
        };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
</script>
</body>
</html>
