<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #2a2a2a;
            border-top-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            color: #888;
            font-size: 0.875rem;
            margin-top: 1rem;
        }

        .error {
            color: #ff3b30;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="message" id="statusMessage">Verificando sala...</div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dados-c9c96-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const salaId = urlParams.get('id');

        const statusDiv = document.getElementById('statusMessage');

        if (!salaId) {
            statusDiv.innerHTML = '❌ ID da sala não encontrado';
            statusDiv.classList.add('error');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        } else {
            verificarSalaERedirecionar(salaId);
        }

        async function verificarSalaERedirecionar(id) {
            try {
                const snapshot = await db.ref(`casas/${id}`).once('value');
                const sala = snapshot.val();

                if (!sala) {
                    statusDiv.innerHTML = '❌ Sala não encontrada';
                    statusDiv.classList.add('error');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }

                const temConteudo = (sala.mensagens && sala.mensagens.length > 0) || (sala.fotos && sala.fotos.length > 0);
                const estaFechada = sala.status === 'fechada';

                if (estaFechada) {
                    statusDiv.innerHTML = '🔒 Sala encerrada. Redirecionando...';
                    setTimeout(() => {
                        window.location.href = `index.html?id=${id}`;
                    }, 1500);
                } else if (temConteudo) {
                    statusDiv.innerHTML = '✅ Sala configurada. Redirecionando para acesso...';
                    setTimeout(() => {
                        window.location.href = `index.html?id=${id}`;
                    }, 1500);
                } else {
                    statusDiv.innerHTML = '⚙️ Sala vazia. Redirecionando para configuração...';
                    setTimeout(() => {
                        window.location.href = `mobile.html?id=${id}`;
                    }, 1500);
                }

            } catch (error) {
                console.error('Erro:', error);
                statusDiv.innerHTML = '❌ Erro ao verificar sala';
                statusDiv.classList.add('error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
    </script>
</body>
</html>
